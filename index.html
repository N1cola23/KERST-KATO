<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voor Kato ❤️ Kerst 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#10201a;--bg2:#2a0d14;--gold:#e8c777;--red:#c8323c;--ink:#f6efe4;--card:#fffaf0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;line-height:1.75;background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg1));background-attachment:fixed;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:50}
.lights{position:fixed;top:0;left:0;right:0;height:26px;z-index:40;display:flex;justify-content:space-around;pointer-events:none}
.lights i{width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:6px;animation:tw 2s infinite alternate}
.lights i:nth-child(4n+1){background:#ff5a5f;box-shadow:0 0 14px #ff5a5f}
.lights i:nth-child(4n+2){background:#ffd166;box-shadow:0 0 14px #ffd166;animation-delay:.4s}
.lights i:nth-child(4n+3){background:#6ee7a0;box-shadow:0 0 14px #6ee7a0;animation-delay:.8s}
.lights i:nth-child(4n){background:#7cc4ff;box-shadow:0 0 14px #7cc4ff;animation-delay:1.2s}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px 40px}
.hero h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(3rem,10vw,6rem);margin:.3em 0 0;color:var(--gold);text-shadow:0 0 30px rgba(232,199,119,.4)}
.hero p{margin:.2em 0;opacity:.9;font-style:italic}
.big{width:min(560px,88vw);aspect-ratio:4/5;border-radius:50% 50% 14px 14px/38% 38% 14px 14px;border:4px solid var(--gold);box-shadow:0 0 0 10px rgba(232,199,119,.15),0 20px 60px #000a;overflow:hidden;position:relative;background:#3a1d24}
.count{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.count div{background:#ffffff12;border:1px solid #e8c77755;border-radius:14px;padding:8px 16px;min-width:76px}
.count b{display:block;font-size:2rem;color:var(--gold);line-height:1.1}
.count span{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.down{margin-top:26px;font-size:2rem;animation:bob 1.6s infinite;color:var(--gold);text-decoration:none}
@keyframes bob{50%{transform:translateY(10px)}}
main{max-width:760px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:2}
.letter{background:linear-gradient(#fffaf0,#f7ead3);color:#3b2a24;border-radius:6px;padding:clamp(24px,6vw,56px);box-shadow:0 20px 70px #000b;position:relative}
.letter:before{content:"";position:absolute;inset:10px;border:2px dashed #c8323c55;border-radius:4px;pointer-events:none}
.letter p{margin:0 0 1.1em}
.letter h2{font-family:'Great Vibes',cursive;font-weight:400;color:var(--red);font-size:2.6rem;margin:.6em 0 .3em}
.hl{color:var(--red);font-weight:600}
.sign{font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--red);text-align:right;margin-top:1em}
.ph{position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,#e7d5b8,#e7d5b8 12px,#efe1c8 12px,#efe1c8 24px)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .nr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#7a5a4a;text-align:center;padding:8px}
.ph.has .nr{display:none}
.hero .ph{width:100%;height:100%}
figure.wide{margin:2em -10px;transform:rotate(-1.2deg)}
figure.wide:nth-of-type(even){transform:rotate(1.2deg)}
figure.wide .ph{aspect-ratio:4/3;border:10px solid #fff;border-bottom-width:44px;box-shadow:0 12px 30px #0006}
figure.wide figcaption{margin-top:-36px;position:relative;text-align:center;font-family:'Great Vibes',cursive;font-size:1.7rem;color:var(--red)}
figure.shot{max-width:340px;margin-left:auto;margin-right:auto}
figure.shot .ph{aspect-ratio:9/19.5}
figure.shot .ph.has{aspect-ratio:auto}
figure.shot .ph.has img{height:auto;object-fit:contain}
.lock{max-width:560px;margin:0 auto;text-align:center;padding:34px 24px 28px;border:2px dashed var(--gold);border-radius:18px;background:#ffffff0d;box-shadow:0 20px 60px #0008;transition:opacity .6s,transform .6s}
.lock.out{opacity:0;transform:scale(.94)}
.lock h2{font-family:'Great Vibes',cursive;font-weight:400;color:var(--gold);font-size:2.6rem;margin:.1em 0 .3em}
.lock p{margin:0 0 .9em}
.gift{font-size:3.4rem;animation:bob 1.8s infinite}
.lock .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.2em}
.lock input{font:inherit;font-size:1.3rem;text-align:center;letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;border-radius:12px;border:2px solid var(--gold);background:#0006;color:var(--ink);width:min(250px,70vw)}
.lock input::placeholder{letter-spacing:.05em;text-transform:none;opacity:.5}
.lock button{font:inherit;font-size:1.2rem;font-weight:600;padding:9px 22px;border-radius:12px;border:0;background:var(--gold);color:#3b1a1f;cursor:pointer}
.lock .err{min-height:1.6em;margin-top:.7em;color:#ff9aa0}
.lock small{opacity:.65;font-style:italic}
.lock.shake .row{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.strip{display:flex;gap:16px;justify-content:center;margin:1.6em 0;flex-wrap:wrap}
.pol{width:min(200px,42vw);background:#fff;padding:8px 8px 26px;box-shadow:0 8px 22px #0005;transform:rotate(var(--r))}
.pol .ph{aspect-ratio:1}
.reveal{opacity:0;transform:translateY(26px);transition:all .9s}
.reveal.in{opacity:1;transform:none}
footer{text-align:center;padding:40px 20px 80px;font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--gold)}
footer small{display:block;font-family:'Cormorant Garamond',serif;font-size:1rem;opacity:.7}
.heart{display:inline-block;animation:hb 1.2s infinite}
@keyframes hb{20%{transform:scale(1.25)}40%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="snow"></canvas>
<div class="lights" id="lights"></div>

<section class="hero">
  <div class="big"><div class="ph" data-n="1"></div></div>
  <h1>Voor Kato</h1>
  <p>Kerst 2026</p>
  <div class="count" id="count"></div>
  <p style="margin-top:14px;font-size:1rem;opacity:.7">tot kerstavond</p>
  <a class="down" href="#brief">↓</a>
</section>

<main id="brief">
<section class="lock" id="lock">
  <div class="gift">🎁</div>
  <h2>Nog even geduld, Kato…</h2>
  <p>Dit is een cadeautje dat pas open mag op <b>kerstavond, 24 december</b>. Nog even wachten dus voor je hem te lezen krijgt...</p>
  <div class="row"><input id="pw" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="geheim woord" aria-label="geheim woord"><button id="go" type="button">Openen</button></div>
  <div class="err" id="err" aria-live="polite"></div>
</section>
<template id="tpl"><article class="letter">
<p class="reveal"><b>Lieve Kato,</b></p>
<p class="reveal">Het is zo ver, <span class="hl">KERSTMIS</span>.</p>
<p class="reveal">Ik weet niet wanneer je dit krijgt want op het moment dat ik dit schrijf weet ik nog niet of we elkaar daadwerkelijk gaan zien op/met kerst. Ik schrijf dit op 24/11, exact een maand voor kerstavond.</p>
<p class="reveal">Zoals je je misschien nog wel herinnerd ben ik gister en vandaag afwezig geweest, niet omdat ik écht ziek ben, maar uit voorzorg. Ik voel me best goed, anders zou ik dit ook niet maken.</p>
<p class="reveal">Kato, dit wordt de beste, leukste en liefste tekst die je <span class="hl">OOIT</span> gaat krijgen. Ik ga jou is echt uitleggen wat je voor me betekent, hoeveel ik van je hou en al m’n geheimen vertellen.</p>

<div class="strip reveal"><div class="pol" style="--r:-4deg"><div class="ph" data-n="2"></div></div><div class="pol" style="--r:3deg"><div class="ph" data-n="3"></div></div></div>

<h2 class="reveal">Allerliefste To</h2>
<p class="reveal">Beginnend een vrolijke kerst en een gelukkig nieuwjaar gewenst, of het nu vandaag, morgen of overmorgen is, maakt niet uit, dit geldt altijd.</p>
<p class="reveal">Ik hoop dat je in 2027 een geweldig jaar hebt, dat je gelukkig blijft, dat al je dromen waarheid mogen worden, dat natuurlijk je gezondheid goed blijft, dat iedereen in je familie en iedereen die je lief hebt gezond is en blijft, dat je eindelijk weer vollenbak kan gaan met je paarden, dat school goed en grotendeels zorgenloos verloopt en dat wij 2027 en elk jaar die daarop volgt samen blijven, gelukkig blijven, moeite en energie blijven steken in elkaar, blijven houden van elkaar en elke dag, dag in-dag uit van elkaar blijven houden, samen alles oplossen en blijven vechten voor datgene waar we allebei al van gedroomd hebben.</p>

<figure class="wide shot reveal"><div class="ph" data-n="4"></div><figcaption>waar alles begon</figcaption></figure>

<p class="reveal">Besef je, Kato? Dat bij deze foto/screenshot alles is begonnen? Ik ben Keano zo dankbaar dat hij jou “ perongeluk ” toegevoegd heeft, zonder hem was dit nooit gebeurt he, To. Ook is er natuurlijk veel aan jou te danken: jij stuurde me “de beslissende” Insta dm.</p>
<p class="reveal">Hoe we van: “ Hey - Hallooo : Jij volgde mij ineens 😂 - Euhm ja jij had me gevoegd op snap : gy mij eerst hahaha … ” tot dit zijn uitgebloeid is toch eigenlijk het mooiste verhaal wat je kan verzinnen?</p>

<div class="strip reveal"><div class="pol" style="--r:3deg"><div class="ph" data-n="5"></div></div><div class="pol" style="--r:-3deg"><div class="ph" data-n="6"></div></div></div>

<p class="reveal">Als je mij tijdens die chats, -/+ 5 maanden geleden had gezegd dat ik jou nu mijn vriendin mag noemen had ik je oprecht uitgelachen en gezegd: “WAT???!!!”, niet omdat ik het niet wou maar meer omdat ik niet wist of niet geloofde dat ik daadwerkelijk een kans maakt.</p>

<figure class="wide reveal"><div class="ph" data-n="7"></div><figcaption>wij twee</figcaption></figure>

<p class="reveal"><b>Liefje,</b></p>
<p class="reveal">Ik heb nog zoveel dingen te vertellen, nog zo veel (kleine) geheimpjes die je niet weet. Je mag nooit twijfelen aan jezelf, To, echt niet. Je maakt mij gelukkiger dan dat ik ooit ben geweest en ik wil dat je dit voor altijd blijft doen.</p>

<div class="strip reveal"><div class="pol" style="--r:-3deg"><div class="ph" data-n="8"></div></div><div class="pol" style="--r:4deg"><div class="ph" data-n="9"></div></div></div>

<p class="reveal">Kato, denk niet aan “wat-als”-scenario’s, er is maar <span class="hl">1 iemand</span> die ik wil, 1 iemand die me gelukkig maakt en 1 iemand die dat altijd blijft doen. Het maakt me niet uit wie me wilt, wie er komt, wie interesse toont, het boeit me oprecht geen reet.</p>
<p class="reveal">Kato, je bent uniek, echt op zo ongelofelijk veel manieren. Veruit het knapste meisje die er bestaat, er is geen enkel meisje die mensen aanvoelt zoals jij dat kan. Niemand heeft de intuïtie die jij hebt, waar ik zo verliefd op ben. Er is niemand met zo’n schattige ogen en zo’n lief lachje zoals jij. Niemand is zo zorgzaam als mijn Totje, niemand kan me ooit zo goed behandelen als jij dat kan. En vooral: niemand kan me zo gelukkig maken zoals jij dat elke keer opnieuw doet.</p>

<div class="strip reveal"><div class="pol" style="--r:4deg"><div class="ph" data-n="10"></div></div><div class="pol" style="--r:-2deg"><div class="ph" data-n="11"></div></div></div>

<p class="reveal">Ik mis jou vanaf het moment dat ik of jij de deur uitstap(t). De reden dat ik eerst in m’n trui bij je lig en daarna in m’n shirt is omdat dan zowel m’n t-shirt als m’n trui naar jou ruiken. Ik kom elke keer in een “verse” trui zodat ik hem na de dag dat we afspreken nog kan dragen en dan ruik ik jou nog en lijkt het dat je nog bij me bent. Het voordeel is dan dat ik je ruik en het voelt alsof je bij me bent; en het nadeel is natuurlijk dat ik je nog extra hard mis.</p>
<p class="reveal">Je kan en zal nooit beseffen hoeveel ik echt van je hou, ik moet echt sorry zeggen want ook dit beschrijft nog geen 1% van hoeveel ik daadwerkelijk van je hou.</p>

<figure class="wide reveal"><div class="ph" data-n="12"></div><figcaption>mijn Totje</figcaption></figure>

<p class="reveal">Geloof me alsjeblieft, Kato, op het feit dat ik echt super veel van je hou, twijfel daar nooit aan!!! Als je onzeker bent: zeg dat gewoon, ik schrijf met liefde een tekstje om je weer op te fleuren. Vreet jezelf dan niet op, zeg het gewoon. We kunnen samen zo veel lachen, zo raar zijn af en toe, maar we begrijpen elkaar echt.</p>
<p class="reveal">Je bent niet alleen m’n vriendin he, To, je bent nog zoveel meer. Je bent m’n beste vriend, m’n maatje, m’n liefje, m’n vriendin, de vrouw met wie ik nu en later alles wil. Huis, kinderen (later), huisdier, <span class="hl">ALLES</span>. Samen gelukkig zijn, met onze familie, vrienden en andere dierbaren.</p>

<div class="strip reveal"><div class="pol" style="--r:-4deg"><div class="ph" data-n="13"></div></div></div>

<p class="reveal">Kato, voor mij is dit niet tijdelijk. Dit is voor altijd, dat meen ik. Je bent de enige die ik wil, de enige die me gelukkig maakt en de enige waar ik aandacht aan geef en wil geven.</p>
<p class="reveal"><b>Ik hou voor altijd van jou, To</b> <span class="heart">❤️</span> x</p>
<div class="sign reveal">Nicola</div>
</article></template>
</main>
<footer id="foot" hidden>Vrolijk kerstfeest, Kato 🎄<small>24 december 2026</small></footer>

<script>
// lichtjes
document.getElementById('lights').innerHTML='<i></i>'.repeat(30);
// foto's: map "foto's" met foto1.jpg … foto13.jpg (ook .jpeg/.png/.webp/.JPG)
const EXT=['jpg','jpeg','png','webp','JPG','JPEG','PNG','heic'];
function loadPhotos(root){root.querySelectorAll('.ph').forEach(el=>{
  const n=el.dataset.n, ph=document.createElement('div');
  ph.className='nr'; ph.textContent="foto "+n; el.appendChild(ph);
  let i=0; const img=new Image();
  const next=()=>{ if(i>=EXT.length) return; img.src="foto's/foto"+n+"."+EXT[i++]; };
  img.onload=()=>{el.insertBefore(img,ph);el.classList.add('has')};
  img.onerror=next; img.alt=""; next();
});}
loadPhotos(document);
// aftellen
const cd=document.getElementById('count');
function tick(){
  let d=new Date(2026,11,24,18,0,0)-new Date(); if(d<0)d=0;
  const v=[['dagen',86400e3],['uur',3600e3],['min',60e3],['sec',1e3]];
  cd.innerHTML=v.map(([l,m])=>{const x=Math.floor(d/m);d-=x*m;return `<div><b>${x}</b><span>${l}</span></div>`}).join('');
}
tick(); setInterval(tick,1000);
// reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function observe(root){root.querySelectorAll('.reveal').forEach(e=>io.observe(e));}
// slot: opent met het woord KATO, of vanzelf op 24 december
let opened=false;
function unlock(){
  if(opened)return; opened=true;
  const lock=document.getElementById('lock'),main=document.getElementById('brief');
  lock.classList.add('out');
  setTimeout(()=>{
    lock.remove();
    main.appendChild(document.getElementById('tpl').content.cloneNode(true));
    document.getElementById('foot').hidden=false;
    loadPhotos(main); observe(main);
    main.scrollIntoView({behavior:'smooth'});
  },600);
}
function tryPw(){
  const pw=document.getElementById('pw'),err=document.getElementById('err'),lock=document.getElementById('lock');
  if(pw.value.trim().toUpperCase()==='KATO67'){err.textContent='';unlock();}
  else{err.textContent='Hmm, dat is het niet helemaal… probeer nog eens 🎄';lock.classList.remove('shake');void lock.offsetWidth;lock.classList.add('shake');}
}
document.getElementById('go').onclick=tryPw;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw()});
function auto(){if(new Date()>=new Date(2026,11,24,0,0,0))unlock()}
auto(); setInterval(auto,30000);
// sneeuw
const c=document.getElementById('snow'),x=c.getContext('2d');let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const fl=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+.8,s:Math.random()*.9+.3,p:Math.random()*6}));
(function f(){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.85)';
fl.forEach(o=>{o.y+=o.s;o.p+=.01;o.x+=Math.sin(o.p)*.5;if(o.y>H){o.y=-5;o.x=Math.random()*W}
x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});requestAnimationFrame(f)})();
</script>
</body></html>
